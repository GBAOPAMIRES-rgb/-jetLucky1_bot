name: Package Lucky Jet collector

on:
  workflow_dispatch:
  push:
    paths:
      - "browser-extension/**"

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package extension
        run: |
          cd browser-extension
          zip -r ../luckyjet-readonly-collector.zip .
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: luckyjet-readonly-collector
          path: luckyjet-readonly-collector.zip
