<!doctype html>
<html lang="ru">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lucky Jet — WebSocket Bridge</title>
<style>
body{font-family:system-ui;background:#070b16;color:#fff;padding:18px;max-width:760px;margin:auto}
textarea{width:100%;box-sizing:border-box;margin:8px 0;padding:12px;border-radius:10px;border:1px solid #334;background:#11182a;color:#fff;font-family:ui-monospace,monospace;font-size:12px;line-height:1.45}
button{padding:12px 16px;border:0;border-radius:10px;margin:6px 4px 6px 0;font-weight:700}
.ok{color:#69e0a3}.warn{color:#ffd166}
</style></head>
<body>
<h2>🔌 Lucky Jet WebSocket Bridge</h2>
<p>Read-only мост для DevSnoop. Цель: <b>/websocket/lifecycle</b>. Он перехватывает только сообщения Lucky Jet и не выполняет никаких игровых действий.</p>
<label>Временный bridge-токен:</label>
<input id="token" type="text" autocomplete="off" spellcheck="false" style="width:100%;box-sizing:border-box;padding:13px;border-radius:10px;border:1px solid #334;background:#11182a;color:#fff;margin:8px 0;font-family:ui-monospace,monospace">
<p id="msg" class="warn">Токен ещё не введён.</p>
<textarea id="script" rows="38" readonly></textarea>
<button id="copy" type="button">Скопировать готовый скрипт</button>
<script>
const TEMPLATE=String.raw`(async()=>{try{
const T="__TOKEN__";if(!T){console.log("[Lucky Jet bridge] token not provided");return}
const E="https://jetlucky1.onrender.com/api/luckyjet-ws-frame-bridge",M="https://jetlucky1.onrender.com/api/luckyjet-ws-meta-bridge",P="https://jetlucky1.onrender.com/api/luckyjet-browser-ping-bridge",C="https://jetlucky1.onrender.com/api/luckyjet-browser-context-bridge",LIFE="/websocket/lifecycle";
const isTarget=(url,raw)=>{const u=String(url||"");const x=String(raw||"");return u.includes(LIFE)&&(x.includes("lucky-jet-")||x.includes("startGame")||x.includes("endGame")||x.includes("stopCoefficient")||x.includes("provablyFair"))};
const safeUrl=url=>{try{const u=new URL(String(url||""));return u.origin+u.pathname}catch{return String(url||"").slice(0,300)}};
const meta=(direction,url,frame,ws)=>{try{const raw=typeof frame==="string"?frame:JSON.stringify(frame);let keyNames=[],keyLengths={};try{const j=JSON.parse(raw);if(j&&typeof j==="object"&&!Array.isArray(j)){for(const [k,v] of Object.entries(j).slice(0,40)){const name=String(k).slice(0,80);keyNames.push(name);if(typeof v==="string")keyLengths[name]=v.length;else if(v!=null)keyLengths[name]=JSON.stringify(v).length;}}}catch(_){};fetch(M,{method:"POST",headers:{"Content-Type":"application/json","X-LuckyJet-Bridge-Token":T},body:JSON.stringify({token:T,direction,url:safeUrl(url),readyState:ws?.readyState??null,protocol:String(ws?.protocol||"").slice(0,120),keyNames,keyLengths,frameLength:raw.length})}).then(r=>r.json()).then(x=>console.log("[Lucky Jet WS metadata] Render",x)).catch(e=>console.log("[Lucky Jet WS metadata] POST error",String(e)))}catch(e){console.log("[Lucky Jet WS metadata] error",String(e))}};
const send=(direction,url,frame)=>{try{const raw=typeof frame==="string"?frame:JSON.stringify(frame);if(!isTarget(url,raw))return;fetch(E,{method:"POST",headers:{"Content-Type":"text/plain;charset=UTF-8","X-LuckyJet-Bridge-Token":T},body:JSON.stringify({token:T,direction,url:safeUrl(url),frame:raw.slice(0,16000)})}).then(r=>r.json()).then(x=>console.log("[Lucky Jet lifecycle bridge] Render",x)).catch(e=>console.log("[Lucky Jet lifecycle bridge] POST error",String(e)))}catch(e){console.log("[Lucky Jet lifecycle bridge] send error",String(e))}};
const attach=(ws)=>{try{const u=String(ws&&ws.url||"");if(ws.__LJattached)return;ws.__LJattached=true;meta("socket",u,"",ws);ws.addEventListener("message",e=>{meta("received",u,e&&e.data,ws);send("received",u,e&&e.data)});ws.addEventListener("open",()=>meta("open",u,"",ws));console.log("[Lucky Jet WS metadata] attached",safeUrl(u))}catch(e){console.log("[Lucky Jet WS metadata] attach error",String(e))}};
fetch(P,{method:"POST",headers:{"Content-Type":"application/json","X-LuckyJet-Bridge-Token":T},body:"{}"}).then(r=>r.json()).then(x=>console.log("[Lucky Jet lifecycle bridge] startup ping",x)).catch(e=>console.log("[Lucky Jet lifecycle bridge] startup ping error",String(e)));
const contextPayload=(()=>{const iframes=[...document.querySelectorAll("iframe")];const origins=iframes.map(f=>{try{return new URL(f.src||"",location.href).origin}catch{return ""}}).filter(Boolean);let topSame=false;try{topSame=window.top===window}catch(_){};return {href:location.href,origin:location.origin,top_same_origin:topSame,iframe_count:iframes.length,iframe_origins:origins,websocket_supported:Boolean(window.WebSocket),websocket_constructor_name:String(window.WebSocket?.name||"").slice(0,80),websocket_wrapped:Boolean(window.WebSocket?.__LJwrapped)}})();
fetch(C,{method:"POST",headers:{"Content-Type":"application/json","X-LuckyJet-Bridge-Token":T},body:JSON.stringify(contextPayload)}).then(r=>r.json()).then(x=>console.log("[Lucky Jet bridge] context",x)).catch(e=>console.log("[Lucky Jet bridge] context POST error",String(e)));
const NativeWS=window.WebSocket,proto=NativeWS&&NativeWS.prototype;if(!proto)throw new Error("WebSocket prototype unavailable");
if(!proto.__LJsend){const n=proto.send;proto.send=function(d){try{meta("sent",this&&this.url,d,this);send("sent",this&&this.url,d)}catch(_){}return n.call(this,d)};proto.__LJsend=true}
if(!window.__LJonmessage){
 try{
  const desc=Object.getOwnPropertyDescriptor(proto,"onmessage");
  if(desc&&desc.set&&desc.get){Object.defineProperty(proto,"onmessage",{configurable:desc.configurable,enumerable:desc.enumerable,get:desc.get,set:function(v){if(typeof v==="function"&&String(this.url||"").includes(LIFE)){const fn=v;v=function(e){try{send("received",this&&this.url,e&&e.data)}catch(_){}return fn.call(this,e)}}return desc.set.call(this,v)}});window.__LJonmessage=true}
 }catch(e){console.log("[Lucky Jet lifecycle bridge] onmessage hook error",String(e))}
}
if(!window.__LJconstructor){
 const WrappedWS=new Proxy(NativeWS,{construct(Target,args,newTarget){const ws=Reflect.construct(Target,args,newTarget);try{attach(ws)}catch(_){}return ws}});
 try{Object.defineProperty(WrappedWS,"__LJwrapped",{value:true})}catch(_){}
 window.WebSocket=WrappedWS;window.__LJconstructor=true;
}
console.log("[Lucky Jet lifecycle bridge] armed. Safe metadata capture is active for all WebSockets; secret values are never sent. Reopen Lucky Jet after this script so new sockets are created.");
}catch(e){console.log("[Lucky Jet lifecycle bridge] install error",String(e))}})();`;
const token=document.getElementById("token"),out=document.getElementById("script"),msg=document.getElementById("msg");
function build(){const t=token.value.trim();out.value=t?TEMPLATE.replaceAll("__TOKEN__",t):"";msg.textContent=t?"Скрипт готов. Нажми «Скопировать готовый скрипт».":"Токен ещё не введён.";msg.className=t?"ok":"warn";}
token.addEventListener("input",build);
document.getElementById("copy").addEventListener("click",async()=>{build();if(!out.value)return;out.focus();out.select();try{await navigator.clipboard.writeText(out.value);msg.textContent="Скрипт скопирован. Вставь его в DevSnoop → Console → Run JavaScript.";msg.className="ok"}catch(e){msg.textContent="Скрипт выделен. Нажми Copy в меню iPhone.";msg.className="warn"}});
build();
</script>
</body></html>
