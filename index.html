<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#050814">
<title>Lucky Jet</title>
<link rel="stylesheet" href="style.css?v=10">
</head>
<body>
<main class="app">
<header class="topbar">
  <div class="brand"><div class="brand-mark">🚀</div><div><div class="eyebrow">LUCKY JET</div><h1 id="pageTitle">Главная</h1></div></div>
  <div class="top-actions"><span id="roleBadge" class="role-badge">USER</span><div class="online"><i></i> ONLINE</div></div>
</header>

<div id="appContent">
<section class="welcome">
  <div><span class="mini-label" id="modeLabel">LUCKY JET</span>
    <h2 id="welcomeTitle">Ваш центр<br><strong>Lucky Jet</strong></h2>
    <p class="muted">Аналитический режим • без автоматических ставок</p>
  </div>
  <div class="mini-orb">🚀</div>
</section>


<section class="dashboard-grid">
  <div class="panel wide">
    <div class="panel-head"><h2>Состояние</h2><span class="tag">READ-ONLY</span></div>
    <div class="signal-result"><span id="mainStatus">ГОТОВ</span><small id="mainStatusSub">Ожидание проверенных данных</small></div>
    <p class="muted" style="margin-top:12px">Все функции находятся в соответствующих разделах ниже.</p>
  </div>
</section>

<div class="section-title"><span>РАЗДЕЛЫ</span><b id="sectionHint">Доступные функции</b></div>
<section class="grid" id="sectionGrid"></section>
<section id="ownerPanel" class="panel owner owner-only hidden"></section>
<section id="panel" class="panel hidden"></section>
<nav class="bottom-nav" id="bottomNav"></nav>
</div>
<footer>🚀 Lucky Jet • аналитический режим • Read-only</footer>
</main>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="app.js?v=10"></script>
</body>
</html>
