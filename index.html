<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Lucky Jet</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="app">
  <header class="topbar"><div><div class="eyebrow">LUCKY JET</div><h1>Сигналы</h1></div><div class="status"><span></span> ONLINE</div></header>
  <section class="hero">
    <div class="orbit"><div class="rocket">🚀</div></div>
    <div class="multiplier" id="multiplier">—</div>
    <div class="muted">аналитический индикатор</div>
    <button id="signalBtn">ПОЛУЧИТЬ СИГНАЛ</button>
    <div id="signalState" class="signal-state">Нажмите кнопку для анализа последних раундов</div>
  </section>
  <section class="grid">
    <button class="card" data-section="history"><b>История</b><span>Последние раунды</span></button>
    <button class="card" data-section="analysis"><b>Анализ</b><span>Статистика</span></button>
    <button class="card" data-section="profile"><b>Профиль</b><span>Аккаунт</span></button>
    <button class="card" data-section="support"><b>Поддержка</b><span>Помощь</span></button>
  </section>
  <section id="panel" class="panel hidden"></section>
  <footer>Только аналитика. Результаты не гарантируются.</footer>
</main>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="app.js"></script>
</body>
</html>
